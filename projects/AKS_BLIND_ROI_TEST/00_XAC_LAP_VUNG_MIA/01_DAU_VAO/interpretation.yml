# Cac gia tri CRS, GEE va resolution ben duoi duoc dong bo tu THONG_SO_DU_AN.yml.
# Nguoi dung chi sua chung tai THONG_SO_DU_AN.yml; tep nay van dung cho mode,
# phenology, lich mua vu va cac cong phan loai.
# auto: dung ROI field co san; neu khong co thi can ROI search + nhan da kiem chung.
mode: auto
resolution_m: 20
crs_mode: auto
crs_epsg: 32649
gee_project_id: rkapp-492504

# Chỉ dùng các quý đã hoàn tất. Ngày này là cận trên loại trừ.
feature_end_date_exclusive: "2026-07-01"
temporal_quarters: 8

# Bắt buộc trước huấn luyện/phân loại.
phenology_alignment_confirmed: true
crop_calendar_source: "AKS_2026 field sampling campaign and plantation records"
crop_calendar_note: "Eight completed quarters are used for local positive-support screening; no binary crop claim."

cloud_score_threshold: 0.60
cloudy_scene_percentage: 80
spatial_block_m: 5000
spatial_folds: 5
random_seed: 42
min_groups_per_class: 3
min_outer_test_per_class: 10
rf_trees: 300
rf_min_leaf: 5
rf_bag_fraction: 0.70
max_samples_per_class: 5000
probability_threshold_default: 0.55
minimum_outer_f1: 0.70
minimum_outer_precision: 0.65
minimum_outer_recall: 0.65
minimum_field_area_ha: 0.10
tile_km: 5

# Tham chiếu AKS là positive-only, không phải binary pretrained model.
reference_max_points: 1000
reference_min_field_area_ha: 0.10
reference_inner_buffer_m: 10
reuse_reference_positive: false
reference_package: ""
# Chỉ bật khi chưa có nhãn không-mía đã kiểm chứng. Kết quả là lớp tương đồng
# dương tính để review, không phải xác suất mía và không được tự đưa vào cLHS.
allow_positive_only_screening: true
positive_screening_min_points: 30
positive_screening_min_complete_fraction: 0.80
positive_screening_prototypes: 8
positive_screening_distance_quantile: 0.90
reference_domain_sample_limit: 2000
reference_minimum_row_fraction: 0.80
reference_minimum_predictor_fraction: 0.90
reference_max_fraction_of_local_training: 0.25
