# DINH NGHIA CHI TIEU PHAN TICH
# ------------------------------------------------------------
# File nay KHONG chua ket qua lab. Ket qua van chi duoc dan vao
# sample_actual.csv. Moi dong mau la mot ket qua trung binh duy nhat
# cua mau; ung dung khong yeu cau hoac tach cot do sau.
#
# Truoc khi noi suy mot chi tieu:
# 1) doi chieu phieu tra ket qua cua phong thi nghiem;
# 2) dien laboratory_method, extraction_ratio (neu co), unit;
# 3) chon dung profile_name;
# 4) doi confirmed thanh true.
#
# classification.approved phai giu false neu chua co bo nguong duoc phe
# duyet cho dung cay trong, vung, phuong phap lab va muc dich su dung.
# Ung dung chi tao ban do ham luong; khong tao khuyen cao lieu phan bon.

schema_version: 1

sample_support:
  interpretation: one_average_result_per_sample
  one_row_per_sample: true

