name: R smoke tests

"on":
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_geospatial_smoke:
        description: "Install geospatial packages and run raster preflight on available data"
        required: false
        default: "false"

jobs:
  r-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install minimal CI packages
        shell: pwsh
        run: |
          Rscript -e "install.packages(c('jsonlite','readr','digest','yaml','openxlsx2'), repos='https://cloud.r-project.org')"

      - name: Parse R scripts
        shell: pwsh
        run: |
          Rscript -e "files <- c(list.files('scripts', pattern='\\.R$', full.names=TRUE), 'rk_evaluation/evaluation.R', 'config/evaluation_profiles.R'); files <- files[file.exists(files)]; invisible(lapply(files, parse))"

      - name: Check agent dependency profile
        shell: pwsh
        run: |
          Rscript scripts/check_dependencies.R --profile agent --output agent/responses/dependency_check_ci.json

      - name: Run input template smoke test
        shell: pwsh
        run: |
          Rscript scripts/input_template_smoke_test.R

      - name: Run transform smoke test
        shell: pwsh
        run: |
          Rscript scripts/transform_smoke_test.R

      - name: Run actual-sample and sensitivity unit tests
        shell: pwsh
        run: |
          Rscript projects/AKS_2026/_NOI_BO/pipeline/tests/test_actual_qa.R
          Rscript projects/AKS_2026/_NOI_BO/pipeline/tests/test_outside_covariate_dissimilarity.R
          Rscript projects/AKS_2026/_NOI_BO/pipeline/tests/test_sensitivity_comparison.R

      - name: Run agent smoke test
        shell: pwsh
        run: |
          Rscript scripts/agent_smoke_test.R

      - name: Run agent loop dry-run
        shell: pwsh
        run: |
          Rscript scripts/agent_loop.R --target pH_H2O --max_iterations 1 --dry_run true

      - name: Run RAG metadata smoke test
        shell: pwsh
        run: |
          Rscript scripts/rag_validate_metadata.R agent/responses/rag_smoke_test_ci.json

  geospatial-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_geospatial_smoke == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install geospatial packages
        shell: pwsh
        run: |
          Rscript -e "install.packages(c('jsonlite','readr','digest','yaml','sf','terra','gstat','sp','blockCV','CAST','lmtest'), repos='https://cloud.r-project.org')"

      - name: Check core dependency profile
        shell: pwsh
        run: |
          Rscript scripts/check_dependencies.R --profile core --output agent/responses/dependency_check_core_ci.json

      - name: Run scientific nested-CV smoke test
        shell: pwsh
        run: |
          Rscript scripts/scientific_validation_smoke_test.R

      - name: Run synthetic full-pipeline smoke test
        shell: pwsh
        run: |
          Rscript scripts/full_pipeline_smoke_test.R

      - name: Run raster preflight if data is present
        shell: pwsh
        run: |
          if (Test-Path input/raster) {
            Rscript scripts/validate_raster_schema.R --output agent/responses/raster_schema_check_ci.json
          } else {
            Write-Host "input/raster is not present in CI checkout; geospatial package install and core dependency check completed."
          }
